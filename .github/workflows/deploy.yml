name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to deploy"
        required: true
        default: "main"

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nextjs

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1. Checkout selected ref
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      # 2. Generate deterministic SHA tag
      - name: Generate Image Tag
        run: |
          TAG=$(git rev-parse HEAD)

          echo "TAG=$TAG" >> $GITHUB_ENV

          echo "Using image tag: $TAG"

      # 3. Login to GHCR
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      # 4. Build & Push Docker image
      - name: Build & Push
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_GTM_ID=${{ secrets.NEXT_PUBLIC_GTM_ID }} \
            -t $IMAGE:${{ env.TAG }} .

          docker tag $IMAGE:${{ env.TAG }} $IMAGE:latest

          docker push $IMAGE:${{ env.TAG }}
          docker push $IMAGE:latest

      # 5. Verify pushed image exists
      - name: Verify Image Exists
        run: |
          docker pull $IMAGE:${{ env.TAG }}

      # 6. Copy the compose file so the server runs the image built above
      - name: Copy compose file to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: /home/deploy/my-portfolio

      # 7. Deploy to server
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            IMAGE=${{ env.IMAGE }}
            TAG=${{ env.TAG }}

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            cd /home/deploy/my-portfolio

            # Runtime secrets live in app.env and are never overwritten here.
            # One-time migration from the old setup, where secrets sat in .env.
            if [ ! -f app.env ]; then
              if [ -f .env ]; then grep -v '^IMAGE_TAG=' .env > app.env || true; else touch app.env; fi
            fi
            grep -q '^ZOHO_EMAIL=' app.env || echo "WARNING: ZOHO_EMAIL is missing from app.env; contact and audit forms cannot send email"

            echo "Deploying image: $IMAGE:$TAG"
            docker pull $IMAGE:$TAG

            # Run exactly this tag (compose reads IMAGE_TAG from the shell)
            IMAGE_TAG=$TAG docker compose up -d --remove-orphans

            # Fail the job if the container is not running the new image
            RUNNING=$(docker inspect rakrilabs-web --format '{{ '{{' }}.Config.Image{{ '}}' }}')
            echo "Container is running: $RUNNING"
            if [ "$RUNNING" != "$IMAGE:$TAG" ]; then
              echo "ERROR: expected $IMAGE:$TAG"
              exit 1
            fi

            docker compose ps

            # Cleanup dangling images
            docker image prune -f
